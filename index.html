<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Seu espaço pessoal para organizar rotina, agenda, tarefas e hábitos." />
    <title>Lume</title>
    <script>
      try {
        var t = localStorage.getItem('lume-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.accent = localStorage.getItem('lume-accent') || 'rose';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="splash" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#FAF7F2;font-family:Georgia,serif;color:#33313A;font-size:28px;letter-spacing:.02em">Lume</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
